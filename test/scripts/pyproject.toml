[project]
name = "lsm6dsr-verify"
version = "0.1.0"
description = "LSM6DSR IMU滤波器验证工具"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
]
